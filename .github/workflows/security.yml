name: Security

on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip

      - name: Scan Git history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          detect --source=/repo --redact --verbose

      - name: Audit locked dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt

      - name: Run high-confidence static analysis
        run: |
          python -m pip install bandit==1.9.4
          bandit -r app scripts -ll || true
          bandit -r app scripts -lll -iii

      - name: Build scan target
        run: docker build --tag dudu-support:security .

      - name: Scan source and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          version: v0.74.0
          exit-code: "1"

      - name: Scan application container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dudu-support:security
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          version: v0.74.0
          exit-code: "1"

      - name: Start dynamic scan target
        run: |
          docker network create dudu-security
          docker run --detach --name dudu-security-api --network dudu-security dudu-support:security

      - name: Run ZAP baseline and reject high-risk alerts
        run: |
          mkdir -p .security-results
          chmod 777 .security-results
          docker run --rm --network dudu-security \
            -v "$PWD/.security-results:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef \
            zap-baseline.py -t http://dudu-security-api:8000/docs -I -J zap.json -r zap.html
          jq -e '[.site[].alerts[]? | select((.riskcode | tonumber) >= 3)] | length == 0' \
            .security-results/zap.json

      - name: Stop dynamic scan target
        if: always()
        run: |
          docker rm --force dudu-security-api 2>/dev/null || true
          docker network rm dudu-security 2>/dev/null || true
