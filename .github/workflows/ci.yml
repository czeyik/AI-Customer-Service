name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_DB: dudu_support_test
          POSTGRES_USER: dudu
          POSTGRES_PASSWORD: dudu_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dudu -d dudu_support_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg://dudu:dudu_test_password@localhost:5432/dudu_support_test
      TEST_POSTGRES_URL: postgresql+psycopg://dudu:dudu_test_password@localhost:5432/dudu_support_test
      LIFECYCLE_INTEGRATION_DATABASE_URL: postgresql+psycopg://dudu:dudu_test_password@localhost:5432/dudu_support_test
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Check dependency integrity
        run: python -m pip check
      - name: Migrate a fresh PostgreSQL database
        run: |
          alembic upgrade head
          alembic check
      - name: Run isolated tests
        run: python -m pytest -q
      - name: Build application image
        run: docker build --tag dudu-support:${{ github.sha }} .
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Prove ARM64 release image and tests
        run: |
          docker buildx build --platform linux/arm64 --target test --output type=cacheonly .
          docker buildx build --platform linux/arm64 --file infra/production/Dockerfile.clamav \
            --target test --output type=cacheonly .
