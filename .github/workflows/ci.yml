name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: dudu_support_test
          POSTGRES_USER: dudu
          POSTGRES_PASSWORD: dudu_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dudu -d dudu_support_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg://dudu:dudu_test_password@localhost:5432/dudu_support_test
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Check dependency integrity
        run: python -m pip check
      - name: Migrate a fresh PostgreSQL database
        run: |
          alembic upgrade head
          alembic check
      - name: Run isolated tests
        run: python -m pytest -q
      - name: Build application image
        run: docker build --tag dudu-support:${{ github.sha }} .
