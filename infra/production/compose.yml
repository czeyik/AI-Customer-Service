name: dudu-${DEPLOY_ENV:?set DEPLOY_ENV}

x-app: &app
  image: ${APP_IMAGE:?APP_IMAGE must be an ECR digest}
  env_file:
    - ${RUNTIME_ENV_FILE:-/run/dudu/runtime.env}
    - ${PLATFORM_ENV_FILE:-/run/dudu/platform.env}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  security_opt:
    - no-new-privileges:true
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL:?set CADDY_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    logging: *logging

  api:
    <<: *app
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
      - --proxy-headers
      - --forwarded-allow-ips=*
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/ready', headers={'Host': os.environ['APP_DOMAIN'], 'X-Forwarded-Proto': 'https'}), timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    mem_limit: 192m

  worker:
    <<: *app
    command: ["python", "-m", "app.workers.all"]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m

  clamav:
    image: ${CLAMAV_IMAGE:?CLAMAV_IMAGE must be an ECR digest}
    restart: unless-stopped
    expose:
      - "3310"
    volumes:
      - clamav_signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    mem_limit: 1150m
    security_opt:
      - no-new-privileges:true
    logging: *logging

  db:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    restart: unless-stopped
    environment:
      POSTGRES_DB: dudu_support
      POSTGRES_USER: dudu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - max_connections=30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dudu -d dudu_support"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  clamav_signatures:
  postgres_data:
