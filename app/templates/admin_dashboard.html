<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DUDU Car Support Inbox</title>
    <link rel="stylesheet" href="/static/admin.css">
  </head>
  <body>
    <header class="topbar">
      <h1>Support Inbox</h1>
      <a href="/admin/logout">Log out</a>
    </header>
    <main class="container">
      <table>
        <thead>
          <tr>
            <th>Ticket</th>
            <th>Urgency</th>
            <th>Status</th>
            <th>Issue</th>
            <th>Channel</th>
            <th>Created</th>
          </tr>
        </thead>
        <tbody>
          {% for ticket in tickets %}
            <tr>
              <td><a href="/admin/tickets/{{ ticket.public_id }}">{{ ticket.public_id }}</a></td>
              <td><span class="pill {{ ticket.urgency }}">{{ ticket.urgency }}</span></td>
              <td>{{ ticket.status }}</td>
              <td>{{ ticket.issue_type }}</td>
              <td>{{ ticket.channel }}</td>
              <td>{{ ticket.created_at.strftime("%Y-%m-%d %H:%M") }}</td>
            </tr>
          {% else %}
            <tr><td colspan="6" class="empty">No tickets yet.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </main>
  </body>
</html>
