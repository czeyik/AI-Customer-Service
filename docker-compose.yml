name: dudu-support-development

services:
  api:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: >-
      sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
      --reload --no-access-log"

  db:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    environment:
      POSTGRES_DB: dudu_support
      POSTGRES_USER: dudu
      POSTGRES_PASSWORD: dudu_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dudu -d dudu_support"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
